[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplane"
version = "1.0.0"
description = "Stateless MCP control plane & gateway for the Model Context Protocol 2026-07-28 spec"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "mcplane contributors" }]
keywords = ["mcp", "model-context-protocol", "gateway", "stateless", "agent", "control-plane"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=7.0"]

[project.scripts]
mcplane = "mcplane.cli.main:main"

[tool.setuptools.packages.find]
include = ["mcplane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
