apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcplane-gateway
  labels:
    app: mcplane
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcplane
  template:
    metadata:
      labels:
        app: mcplane
    spec:
      containers:
        - name: gateway
          image: mcplane:1.0.0
          ports:
            - containerPort: 8090
          env:
            - name: MCPLANE_GATEWAY__PORT
              value: "8090"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
