replicaCount: 3

image:
  repository: mcplane
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  hosts:
    - host: mcplane.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

config:
  gatewayPort: 8090
  servers: |
    {
      "echo": {
        "url": "http://mock-server.default.svc.cluster.local/mcp",
        "description": "Mock echo + calculator MCP server"
      }
    }
