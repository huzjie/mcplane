apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcplane.fullname" . }}
  labels:
    {{- include "mcplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcplane.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcplane.labels" . | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: MCPLANE_GATEWAY__PORT
              value: {{ .Values.config.gatewayPort | quote }}
          volumeMounts:
            - name: config
              mountPath: /app/servers.json
              subPath: servers.json
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mcplane.fullname" . }}-config
